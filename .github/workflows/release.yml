name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: [self-hosted, aritiq]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The semver base comes from the conventional commits made since the last release tag, and
      # the build suffix is the commit count, which doubles as the Android versionCode. Both are
      # passed to Gradle as -P overrides so there is no version file to drift out of date.
      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          build=$(git rev-list --count HEAD)

          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          base="${last_tag#v}"
          base="${base%-*}"
          if [ -z "$base" ]; then base=0.1.0; fi
          IFS='.' read -r major minor patch <<< "$base"

          # 3 = major, 2 = minor, 1 = patch, 0 = nothing worth releasing. The escaped parens
          # matter: a scoped "feat(editor):" does not match a bare "feat:" pattern.
          rank=0
          if [ -n "$last_tag" ]; then
            while IFS= read -r line; do
              case "$line" in
                *!:*|*BREAKING\ CHANGE:*) rank=3 ;;
                feat\(*\)*:*|feat:*)
                  if [ "$rank" -lt 2 ]; then rank=2; fi ;;
                fix\(*\)*:*|fix:*|perf\(*\)*:*|perf:*|revert\(*\)*:*|revert:*)
                  if [ "$rank" -lt 1 ]; then rank=1; fi ;;
              esac
            done < <(git log --format='%s%n%b' "$last_tag..HEAD")
          fi

          if [ "$rank" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No releasable commit since ${last_tag:-the start of history}; skipping release."
            exit 0
          fi

          case $rank in
            3) major=$((major + 1)); minor=0; patch=0 ;;
            2) minor=$((minor + 1)); patch=0 ;;
            1) patch=$((patch + 1)) ;;
          esac

          {
            echo "code=$build"
            echo "name=$major.$minor.$patch-$build"
            echo "base=$major.$minor.$patch"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${last_tag:-<no prior tag>} -> v$major.$minor.$patch-$build (bump rank $rank)"

      - name: Build signed release APK
        if: steps.version.outputs.skip != 'true'
        run: |
          ./gradlew :composeApp:assembleRelease \
            -Pandroid.versionCodeOverride=${{ steps.version.outputs.code }} \
            -Pandroid.versionNameOverride=${{ steps.version.outputs.name }}

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          files: composeApp/build/outputs/apk/release/*.apk
          generate_release_notes: true
