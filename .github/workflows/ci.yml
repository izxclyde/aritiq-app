name: CI

# PR gate: compile, unit tests, and lint. (release.yml handles signed builds on push to main.)
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Compile, test, lint
        run: >
          ./gradlew
          :composeApp:compileDebugKotlinAndroid
          :composeApp:testDebugUnitTest
          :composeApp:lintDebug
          --console=plain

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: composeApp/build/reports/
          if-no-files-found: ignore
